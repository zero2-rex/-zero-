<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Demo - Xin chào</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Xin chào 👋</h1>
        <p>Đây là trang web mẫu được tạo nhanh bằng HTML/CSS/JS.</p>

        <div class="controls">
          <input id="nameInput" type="text" placeholder="Nhập tên của bạn" />
          <button id="greetBtn">Chào mình đi</button>
        </div>

        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
